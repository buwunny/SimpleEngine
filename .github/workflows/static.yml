name: Deploy static content to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 git

      - name: Install and activate EMSDK, build web
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh
          cd $GITHUB_WORKSPACE
          emcmake cmake --preset game-web
          cmake --build --preset game-web -j
          cmake --install build/game-web
          emcmake cmake --preset editor-web
          cmake --build --preset editor-web -j
          cmake --install build/editor-web
        shell: bash

      - name: Assemble site (landing at /, game at /play, editor at /edit)
        env:
          # Set repository variable COWENGINE_API to the control-plane base,
          # e.g. https://game.cowengine.com. /play uses it for the lobby and
          # /edit uses it to enable Build > Publish.
          COWENGINE_API: ${{ vars.COWENGINE_API }}
          # Set repository variable COWENGINE_SERVER_WS to bake the multiplayer
          # server into the published game, e.g. wss://game.cowengine.com/net
          # (and optionally COWENGINE_SERVER_WT for the WebTransport URL,
          # usually https://game.cowengine.com:4443/net).
          # Leave unset to publish a single-player game (players can still opt
          # in with ?ws=/?wt= query params).
          COWENGINE_SERVER_WS: ${{ vars.COWENGINE_SERVER_WS }}
          COWENGINE_SERVER_WT: ${{ vars.COWENGINE_SERVER_WT }}
          # Optional: set repository variable PAGES_CNAME (e.g. cowengine.com) to
          # publish under a custom domain. Also configure it in Settings > Pages.
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
        run: |
          mkdir -p site site/play site/edit
          cp deploy/landing/index.html site/index.html
          cp -r dist/game-web/. site/play/
          cp -r dist/editor-web/. site/edit/
          # .nojekyll: Pages' Jekyll step would drop files/dirs that start with an
          # underscore (emscripten emits none today, but this keeps it robust).
          touch site/.nojekyll
          if [ -n "$PAGES_CNAME" ]; then echo "$PAGES_CNAME" > site/CNAME; echo "CNAME -> $PAGES_CNAME"; fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse, urlunparse

          api = os.environ.get("COWENGINE_API", "").strip()
          ws = os.environ.get("COWENGINE_SERVER_WS", "").strip()
          wt = os.environ.get("COWENGINE_SERVER_WT", "").strip()

          def derive_api_from_transport(url: str) -> str:
            if not url:
              return ""
            parsed = urlparse(url)
            scheme = {"ws": "http", "wss": "https"}.get(parsed.scheme, parsed.scheme)
            if not scheme or not parsed.netloc:
              return ""
            return urlunparse((scheme, parsed.netloc, "", "", "", ""))

          def normalize_websocket_url(url: str) -> str:
            if not url:
              return ""
            parsed = urlparse(url)
            if parsed.scheme not in ("ws", "wss") or not parsed.netloc:
              return url
            path = parsed.path or ""
            if not path or path == "/":
              path = "/net"
            elif not path.startswith("/"):
              path = "/" + path
            return urlunparse((parsed.scheme, parsed.netloc, path, parsed.params, parsed.query, parsed.fragment))

          ws = normalize_websocket_url(ws)
          wt = normalize_websocket_url(wt)
          if not api:
            api = derive_api_from_transport(ws) or derive_api_from_transport(wt)

          if api:
            for path in ["site/play/index.html", "site/edit/index.html"]:
              with open(path, encoding="utf-8") as f:
                html = f.read()
              marker = "var __COWENGINE_API__ = null;"
              if marker not in html:
                print(f"WARNING: API marker not found in {path}")
                continue
              html = html.replace(marker, f"var __COWENGINE_API__ = '{api}';")
              with open(path, "w", encoding="utf-8") as f:
                f.write(html)
            print(f"Baked control API into /play and /edit: {api}")
          else:
            print("No COWENGINE_API set — /play lobby stays disabled and /edit publish stays unavailable.")

          if ws or wt:
            fields = []
            if ws: fields.append(f'ws:"{ws}"')
            if wt: fields.append(f'wt:"{wt}"')
            obj = "{" + ",".join(fields) + "}"
            path = "site/play/index.html"
            with open(path, encoding="utf-8") as f:
              html = f.read()
            marker = "var __COWENGINE_SERVER__ = null;"
            if marker not in html:
              print("WARNING: server-config marker not found in game index.html")
            else:
              html = html.replace(marker, f"var __COWENGINE_SERVER__ = {obj};")
              with open(path, "w", encoding="utf-8") as f:
                f.write(html)
              print(f"Baked server config into /play: {obj}")
          else:
            print("No COWENGINE_SERVER_WS/_WT set — game published single-player.")
          PY
        shell: bash

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
